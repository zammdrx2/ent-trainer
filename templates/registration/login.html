{% extends "base.html" %}
{% block title %}{{ t.login }} · {{ t.site_title }}{% endblock %}
{% block content %}
<div class="card auth">
  <h1>{{ t.login }}</h1>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn--wide" type="submit">{{ t.login }}</button>
  </form>
  <p class="muted">{{ t.no_account }} <a href="{% url 'signup' %}">{{ t.signup }}</a></p>
</div>
{% endblock %}
